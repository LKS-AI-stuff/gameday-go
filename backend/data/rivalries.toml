# Featured rivalries (BRD Appendix B): well-known non-division matchups that get the
# High-weight "Featured rivalry" tag whichever team is home. Division rivalries are
# tagged automatically and aren't listed. Team IDs are API-Sports team codes.
# Reviewed before each season; reload with `uv run python -m app.cli seed`.

