# Gaps in API-Sports reference data (FR-O1a, TD13).
#
# API-Sports reports a game venue's name and city, but no state or country. Each venue city
# in the schedule needs an entry: US cities give the state (coordinates then come from the
# Census Places file), other cities give the country and city coordinates. Cities the
# Places file can't resolve also give coordinates. `cli seed` and `cli sync-schedule` report
# any venue city missing here; its games then have no distance and no international tag.
#
# Optional per-team overrides go under [teams.<code>] (name, nickname, city, state,
# conference, division, home_venue_name).

[venue_cities.Arlington]
state = "TX"
